# Goes inside the BT panel's server block for vote.jh8.ai
# (/www/server/panel/vhost/nginx/html_vote.jh8.ai.conf), between #VOTE-API-START and #VOTE-API-END.
# Also delete the panel's two static-file regex blocks (`location ~ .*\.(gif|jpg|...)$` and
# `location ~ .*\.(js|css)?$`): they would serve /admin/app.js and /static/*.webp from the empty
# site root and return 404. Keep the panel's well-known / ACME include and the HTTPS redirect.
#VOTE-API-START
client_max_body_size 5m;
location = / { return 302 /admin/; }
location / {
    proxy_pass http://127.0.0.1:8030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
location ^~ /static/assets/ {
    proxy_pass http://127.0.0.1:8030;
    proxy_set_header Host $host;
    expires 7d;
    access_log off;
}
#VOTE-API-END
